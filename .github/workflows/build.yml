name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: android
            os: ubuntu-latest
          - platform: macos
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build Android
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: tar -czf synshare-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath synshare-windows-x64.zip

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/synshare.app synshare-macos.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: synshare-${{ matrix.platform }}
          path: |
            synshare-linux-x64.tar.gz
            synshare-windows-x64.zip
            build/app/outputs/flutter-apk/app-release.apk
            synshare-macos.app.zip
          if-no-files-found: error
